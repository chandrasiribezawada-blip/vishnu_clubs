services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vishnuconnect
      POSTGRES_USER: vishnuconnect
      POSTGRES_PASSWORD: vishnuconnect
    ports:
      - "5432:5432"
    volumes:
      - vishnuconnect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishnuconnect -d vishnuconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://vishnuconnect:vishnuconnect@db:5432/vishnuconnect
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  vishnuconnect_postgres:
